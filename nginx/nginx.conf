events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
  client_max_body_size 50M;

  # Rate limiting
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=webhook:10m rate=200r/s;

  # ─── HTTP → HTTPS redirect ────────────────────────────────────────────────
  server {
    listen 80;
    server_name atendai.ftech-apps.com.br;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ─── HTTPS Principal ──────────────────────────────────────────────────────
  server {
    listen 443 ssl;
    server_name atendai.ftech-apps.com.br;

    ssl_certificate /etc/letsencrypt/live/atendai.ftech-apps.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atendai.ftech-apps.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # /api → Backend
    location /api/ {
      proxy_pass http://backend:3001/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /webhooks → Backend (webhooks sem prefixo /api)
    location /webhooks/ {
      limit_req zone=webhook burst=300 nodelay;
      proxy_pass http://backend:3001/webhooks/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # /socket.io → Backend WebSocket
    location /socket.io/ {
      proxy_pass http://backend:3001;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # /whatsapp → Evolution API
    location /whatsapp/ {
      rewrite ^/whatsapp/(.*) /$1 break;
      proxy_pass http://evolution-api:8080;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      client_max_body_size 100M;
    }

    # / → Dashboard Next.js
    location / {
      proxy_pass http://dashboard:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }
  }

  # ─── HTTP simples (fallback antes do SSL) ─────────────────────────────────
  server {
    listen 80 default_server;
    server_name _;

    # /api → Backend
    location /api/ {
      proxy_pass http://backend:3001/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /webhooks/ {
      proxy_pass http://backend:3001/webhooks/;
      proxy_set_header Host $host;
    }

    location /socket.io/ {
      proxy_pass http://backend:3001;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    location /whatsapp/ {
      rewrite ^/whatsapp/(.*) /$1 break;
      proxy_pass http://evolution-api:8080;
      client_max_body_size 100M;
    }

    location / {
      proxy_pass http://dashboard:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
    }
  }
}
